<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Records</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-[#1a1a2e] to-black min-h-screen text-gray-200 font-sans flex">

<!-- Glassmorphism Sidebar (Consistent across pages) -->
<aside class="w-64 flex flex-col m-4 rounded-3xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-2xl p-6 hidden md:flex">
    <div class="mb-10">
        <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">
            AI Workforce
        </h1>
        <p class="text-xs text-gray-400 mt-1 tracking-wider uppercase">Management Platform</p>
    </div>

    <nav class="flex-1 space-y-3">
        <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 text-gray-300 hover:text-white transition-all">
            Dashboard
        </a>
        <!-- Active State moved to View Employees -->
        <a href="/viewEmployees" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600/20 text-blue-300 border border-blue-500/30 transition-all shadow-[0_0_15px_rgba(59,130,246,0.15)]">
            View Employees
        </a>
        <a sec:authorize="hasAuthority('ADMIN')" href="/add" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 text-gray-300 hover:text-white transition-all">
            Add Employee
        </a>

        <div class="pt-6 mt-6 border-t border-white/10">
            <a href="/ai-assistant" class="flex items-center justify-center gap-2 w-full px-4 py-3 rounded-xl bg-purple-600/20 hover:bg-purple-600/40 text-purple-300 border border-purple-500/30 transition-all">
                🤖 AI HR Assistant
            </a>
        </div>
    </nav>
</aside>

<!-- Main Content Workspace -->
<main class="flex-1 p-4 md:p-8 flex flex-col overflow-y-auto">

    <!-- Header & Search Area -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
        <div>
            <h2 class="text-3xl font-semibold text-white tracking-wide">Employee Records</h2>
            <p class="text-gray-400 mt-1">
                Total Employees: <span th:text="${employees.size()}" class="text-blue-400 font-bold"></span>
            </p>
        </div>

        <!-- Modern Search Box -->
        <div class="relative w-full md:w-72">
            <input type="text" id="search" onkeyup="searchEmployee()" placeholder="Search employee name..."
                   class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all backdrop-blur-md">
        </div>
    </header>

    <!-- Glassmorphic Data Table -->
    <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-1 md:p-6 shadow-2xl overflow-x-auto relative">

        <table id="empTable" class="w-full text-left border-collapse min-w-max">
            <thead>
            <tr>
                <th class="pb-4 pt-2 px-4 border-b border-white/10 text-xs font-medium text-gray-400 uppercase tracking-wider">ID</th>
                <th class="pb-4 pt-2 px-4 border-b border-white/10 text-xs font-medium text-gray-400 uppercase tracking-wider">Name</th>
                <th class="pb-4 pt-2 px-4 border-b border-white/10 text-xs font-medium text-gray-400 uppercase tracking-wider">Age</th>
                <th class="pb-4 pt-2 px-4 border-b border-white/10 text-xs font-medium text-gray-400 uppercase tracking-wider">City</th>
                <th class="pb-4 pt-2 px-4 border-b border-white/10 text-xs font-medium text-gray-400 uppercase tracking-wider">State</th>
                <!-- Render Actions column header only for ADMIN -->
                <th sec:authorize="hasAuthority('ADMIN')" class="pb-4 pt-2 px-4 border-b border-white/10 text-xs font-medium text-gray-400 uppercase tracking-wider text-right">Actions</th>
            </tr>
            </thead>
            <tbody class="text-sm">
            <tr th:each="emp : ${employees}" class="border-b border-white/5 hover:bg-white/5 transition-colors group">

                <td class="py-4 px-4 text-gray-500 font-mono" th:text="${emp.id}"></td>
                <td class="py-4 px-4 text-gray-200 font-medium" th:text="${emp.empName}"></td>
                <td class="py-4 px-4 text-gray-400" th:text="${emp.empAge}"></td>
                <td class="py-4 px-4 text-gray-400" th:text="${emp.empCity}"></td>
                <td class="py-4 px-4 text-gray-400" th:text="${emp.empState}"></td>

                <!-- Admin Actions -->
                <td class="py-4 px-4" sec:authorize="hasAuthority('ADMIN')">
                    <div class="flex justify-end gap-2 opacity-80 group-hover:opacity-100 transition-opacity">
                        <a th:href="@{'/edit/' + ${emp.id}}"
                           class="px-3 py-1.5 bg-green-500/10 hover:bg-green-500/20 text-green-400 border border-green-500/20 rounded-lg text-xs font-medium transition-all">
                            Edit
                        </a>
                        <a th:href="@{'/delete/' + ${emp.id}}"
                           onclick="return confirm('Delete this employee?')"
                           class="px-3 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 rounded-lg text-xs font-medium transition-all">
                            Delete
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Empty State (Optional fallback if search yields nothing) -->
        <div id="noResults" class="hidden text-center py-10 text-gray-500">
            No employees found matching your search.
        </div>
    </div>

</main>

<!-- Preserved Search JavaScript -->
<script>
    function searchEmployee() {
        let input = document.getElementById("search").value.toUpperCase();
        let table = document.getElementById("empTable");
        let tr = table.getElementsByTagName("tr");
        let hasVisibleRows = false;

        for (let i = 1; i < tr.length; i++) {
            let td = tr[i].getElementsByTagName("td")[1]; // Searching by Name column
            if (td) {
                let txt = td.textContent || td.innerText;
                if (txt.toUpperCase().indexOf(input) > -1) {
                    tr[i].style.display = "";
                    hasVisibleRows = true;
                } else {
                    tr[i].style.display = "none";
                }
            }
        }

        // Show/hide empty state message
        let noResults = document.getElementById("noResults");
        if(noResults) {
            noResults.style.display = hasVisibleRows || tr.length <= 1 ? "none" : "block";
        }
    }
</script>
</body>
</html>
