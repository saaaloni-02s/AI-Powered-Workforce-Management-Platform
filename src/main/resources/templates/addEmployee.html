<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <h1>Add Employee</h1>

    <form action="/saveEmployee" method="post">

        <input type="text" name="empName" placeholder="Enter Employee Name" required>

        <input type="number" name="empAge" placeholder="Enter Age" required>

        <input type="text" name="empCity" placeholder="Enter City" required>

        <input type="text" name="empState" placeholder="Enter State" required>

        <input type="password" name="empPassword" placeholder="Enter Password" required>

        <button class="btn" type="submit">Save Employee</button>

    </form>

    <br>

    <a href="/" class="btn"> Back to Home</a>

</div>

</body>
</html>
