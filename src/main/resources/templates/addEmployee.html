<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee - AI Workforce</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-[#1a1a2e] to-black min-h-screen text-gray-200 font-sans flex">

<!-- Glassmorphism Sidebar -->
<aside class="w-64 flex flex-col m-4 rounded-3xl bg-white/5 backdrop-blur-xl border border-white/10 shadow-2xl p-6 hidden md:flex">
    <div class="mb-10">
        <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">
            AI Workforce
        </h1>
        <p class="text-xs text-gray-400 mt-1 tracking-wider uppercase">Management Platform</p>
    </div>

    <nav class="flex-1 space-y-3">
        <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 text-gray-300 hover:text-white transition-all">
            Dashboard
        </a>
        <a href="/viewEmployees" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 text-gray-300 hover:text-white transition-all">
            View Employees
        </a>
        <!-- Active State on Add Employee -->
        <a sec:authorize="hasAuthority('ADMIN')" href="/add" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600/20 text-blue-300 border border-blue-500/30 transition-all shadow-[0_0_15px_rgba(59,130,246,0.15)]">
            Add Employee
        </a>

        <div class="pt-6 mt-6 border-t border-white/10">
            <a href="/ai-assistant" class="flex items-center justify-center gap-2 w-full px-4 py-3 rounded-xl bg-purple-600/20 hover:bg-purple-600/40 text-purple-300 border border-purple-500/30 transition-all">
                🤖 AI HR Assistant
            </a>
        </div>
    </nav>
</aside>

<!-- Main Content Workspace -->
<main class="flex-1 p-4 md:p-8 flex flex-col overflow-y-auto">

    <!-- Header -->
    <header class="mb-8">
        <h2 class="text-3xl font-semibold text-white tracking-wide">Add New Employee</h2>
        <p class="text-gray-400 mt-1">Enter the details to register a new team member.</p>
    </header>

    <!-- Glassmorphic Form Card -->
    <div class="max-w-3xl bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 shadow-2xl relative">

        <form action="/saveEmployee" method="post" class="space-y-6">

            <!-- Full Width: Name -->
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Full Name</label>
                <input type="text" name="empName" placeholder="e.g. Sanchari Pandey" required
                       class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
            </div>

            <!-- Grid: Age & City -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Age</label>
                    <input type="number" name="empAge" placeholder="e.g. 26" required
                           class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">City</label>
                    <input type="text" name="empCity" placeholder="e.g. Lucknow" required
                           class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>
            </div>

            <!-- Grid: State & Password -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">State</label>
                    <input type="text" name="empState" placeholder="e.g. Uttar Pradesh" required
                           class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Initial Password</label>
                    <input type="password" name="empPassword" placeholder="••••••••" required
                           class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-6 mt-6 border-t border-white/10 flex items-center justify-end gap-4">
                <a href="/viewEmployees"
                   class="px-6 py-3 text-gray-400 hover:text-white transition-colors font-medium">
                    Cancel
                </a>
                <button type="submit"
                        class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl shadow-lg shadow-blue-500/30 transition-all font-medium border border-blue-500/50">
                    Save Employee
                </button>
            </div>

        </form>
    </div>

</main>

</body>
</html>
