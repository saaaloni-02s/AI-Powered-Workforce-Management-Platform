<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Workforce</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-[#1a1a2e] to-black min-h-screen text-gray-200 font-sans flex items-center justify-center relative overflow-hidden py-10">

<!-- Ambient Background Glows -->
<div class="absolute top-1/3 right-1/3 w-96 h-96 bg-purple-600/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-1/3 left-1/3 w-96 h-96 bg-blue-600/20 rounded-full blur-[100px] pointer-events-none"></div>

<!-- Centered Glassmorphic Card -->
<div class="w-full max-w-lg p-8 bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl relative z-10 m-4">

    <div class="text-center mb-8">
        <h1 class="text-3xl font-semibold text-white">Create Account</h1>
        <p class="text-gray-400 text-sm mt-2">Join the AI-powered platform.</p>
    </div>

    <!-- Dynamic Error Message -->
    <div th:if="${error}" class="mb-6 p-4 bg-red-500/10 border border-red-500/30 rounded-xl flex items-center gap-3">
        <span class="text-red-400">⚠️</span>
        <p class="text-red-400 text-sm font-medium" th:text="${error}"></p>
    </div>

    <form action="/register" method="post" class="space-y-5">

        <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Full Name</label>
            <input type="text" name="fullName" placeholder="e.g. Saloni Singh" required
                   class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Username</label>
                <input type="text" name="username" placeholder="Choose a username" required
                       class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Email</label>
                <input type="email" name="email" placeholder="name@company.com" required
                       class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
            </div>
        </div>

        <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">System Role</label>
            <select name="role" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-gray-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all appearance-none [&>option]:bg-[#1a1a2e]">
                <option value="USER" selected>User (Standard Access)</option>
                <option value="ADMIN">Admin (Full Control)</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Password</label>
            <input type="password" name="password" placeholder="Create a strong password" required
                   class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
        </div>

        <button type="submit" class="w-full py-3.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl shadow-lg shadow-purple-500/30 transition-all font-bold border border-purple-500/50 mt-6">
            Register Account
        </button>
    </form>

    <div class="mt-8 text-center border-t border-white/10 pt-6">
        <p class="text-gray-400 text-sm">
            Already have an account?
            <a href="/login" class="text-purple-400 hover:text-purple-300 font-medium transition-colors">Log In</a>
        </p>
    </div>

</div>

</body>
</html>
