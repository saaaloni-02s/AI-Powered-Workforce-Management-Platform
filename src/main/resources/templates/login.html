<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Workforce</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-[#1a1a2e] to-black min-h-screen text-gray-200 font-sans flex items-center justify-center relative overflow-hidden">

<!-- Ambient Background Glows -->
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[100px] pointer-events-none"></div>

<!-- Centered Glassmorphic Card -->
<div class="w-full max-w-md p-8 bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl relative z-10 m-4">

    <div class="text-center mb-8">
        <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 mb-2">
            AI Workforce Management
        </h1>
        <h2 class="text-3xl font-semibold text-white">Welcome Back!</h2>
        <p class="text-gray-400 text-sm mt-2">Please sign in to access your dashboard.</p>
    </div>

    <form action="/login" method="post" class="space-y-5">

        <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Username</label>
            <input type="text" name="username" placeholder="Enter your username" required
                   class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
        </div>

        <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Password</label>
            <input type="password" name="password" placeholder="••••••••" required
                   class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
        </div>

        <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl shadow-lg shadow-blue-500/30 transition-all font-bold border border-blue-500/50 mt-4">
            Login
        </button>
    </form>

    <div class="mt-8 text-center border-t border-white/10 pt-6">
        <p class="text-gray-400 text-sm">
            Don't have an account?
            <a href="/register" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Create Account</a>
        </p>
    </div>

</div>

</body>
</html>
